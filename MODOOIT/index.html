<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c2430" />
  <meta name="description" content="경기도 외국인 주민과 한국인을 연결하는 언어교환·지역정착 커뮤니티, 모두잇  MATE의 체험형 프로토타입입니다." />
  <title>모두잇  MATE | 연결에서 정착까지</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner shell">
      <button class="brand" type="button" data-route="home" aria-label="모두잇  MATE 홈">
        <span class="brand-symbol" aria-hidden="true"><span class="symbol-dot"></span><span class="symbol-loop"></span></span>
        <span class="brand-wordmark">모두잇 <span>MATE</span><small>경기도에서 시작하는 새로운 연결</small></span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="주요 메뉴">
        <button class="nav-item active" data-route="home">홈</button>
        <button class="nav-item" data-route="matching">메이트 찾기</button>
        <button class="nav-item" data-route="community">생활 커뮤니티</button>
        <button class="nav-item" data-route="missions">미션 & 리워드</button>
        <button class="nav-item" data-route="chat">채팅 <span class="nav-demo-dot"></span></button>
      </nav>
      <div class="header-actions">
        <button class="points-button" data-route="profile" title="내 포인트 보기"><span id="headerPointIcon"></span><strong id="headerPoints">120</strong><span>P</span></button>
        <button class="avatar-button" type="button" data-route="profile" aria-label="내 프로필 열기"><span id="headerAvatar">민</span></button>
        <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="메뉴 펼치기" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <footer class="footer">
    <div class="shell footer-inner">
      <div><div class="footer-brand">모두잇 <span>MATE</span><span class="footer-heart">✳</span></div><p>언어를 넘어 사람을, 정보를 넘어 일상을 연결합니다.</p></div>
      <div class="footer-right"><span>창업 아이디어 시연용 프로토타입</span><span>실제 매칭 · 메시지 전송 · 결제는 지원되지 않습니다.</span><button type="button" data-action="open-safety">안전 이용 안내</button></div>
    </div>
  </footer>
  <div id="toastArea" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
